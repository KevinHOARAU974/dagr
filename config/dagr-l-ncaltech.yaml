# path: "/data/storage/daniel/aegnn"
# output_directory: "test_dagr"
seed: 12345

pooling_dim_at_output: 5x7

task: detection
dataset: ncaltech101

# graph construction

radius: 0.01
max_neighbors: 16

time_window_us: 1000000
n_nodes: 50000

batch_size: 8

activation: relu
edge_attr_dim: 2
aggr: sum
kernel_size: 5
pooling_aggr: max

base_width: 0.5
after_pool_width: 1
net_stem_width: 1
yolo_stem_width: 1
num_scales: 1

# learning
weight_decay: 0.00001
clip: 0.1

aug_trans: 0.1
aug_p_flip: 0
aug_zoom: 1
l_r: 0.001
tot_num_epochs: 1

resume: none
