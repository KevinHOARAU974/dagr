[build-system]
requires = ["setuptools>=61", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "dagr"
version = "0.0.0"
description = "Deep asynchronous GNN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]